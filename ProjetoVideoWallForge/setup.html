<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Configurar Painel</title>
  <style>
    body {
      font-family: sans-serif;
      background: #222;
      color: #fff;
      padding: 30px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 5px;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .url-grid {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Configuração do VideoWall</h2>
  <label>Linhas:</label>
  <input type="number" id="rows" min="1" value="2">
  <label>Colunas:</label>
  <input type="number" id="cols" min="1" value="3">

  <div id="urlContainer" class="url-grid"></div>

  <button onclick="generateFields()">Gerar Campos</button>
  <button onclick="saveConfig()">Salvar e Iniciar</button>

  <script>
    const fs = require('fs');
    const { ipcRenderer } = require('electron');
    const configPath = './config.json';

    function generateFields() {
      const rows = parseInt(document.getElementById('rows').value);
      const cols = parseInt(document.getElementById('cols').value);
      const container = document.getElementById('urlContainer');
      container.innerHTML = '';
      container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      for (let i = 0; i < rows * cols; i++) {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = `URL painel ${i + 1}`;
        input.classList.add('url-input');
        container.appendChild(input);
      }
    }

    function saveConfig() {
      const urls = Array.from(document.querySelectorAll('.url-input')).map(e => e.value || '');
      const rows = parseInt(document.getElementById('rows').value);
      const cols = parseInt(document.getElementById('cols').value);

      const config = {
        rows,
        cols,
        cropTop: 0,
        cropBottom: 0,
        zoom: 1.15,
        fullscreenIndexes: [],
        urls
      };

      fs.writeFileSync(configPath, JSON.stringify(config, null, 2));
      ipcRenderer.send('open-grid');
    }

    generateFields(); // inicializa com os valores padrão
  </script>
</body>
</html>
