<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>VideoWall</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh; width: 100vw;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
    }
    #grid {
      display: grid;
      width: 100vw;
      height: 100vh;
      gap: 5px;
    }
    .iframe-wrapper {
      position: relative;
      overflow: hidden;
      background: white;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      transform-origin: top;
      margin-top: var(--crop-top, 0px);
    }
    .iframe-wrapper.dragging {
      opacity: 0.6;
      transform: scale(1.05);
    }
    .crop-overlay {
      position: absolute;
      left: 0;
      width: 100%;
      background: white;
      z-index: 3;
      pointer-events: none;
    }
    .crop-bottom { bottom: 0; }
    .drag-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      background: transparent;
      cursor: move;
    }
    .fullscreen-cell iframe {
      transform: scale(1) !important;
      margin-top: 0 !important;
    }
    .fullscreen-cell .crop-overlay {
      display: none;
    }
    .fullscreen-toggle {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 5;
      font-size: 16px;
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      border-radius: 5px;
      padding: 4px 8px;
      cursor: pointer;
      display: none;
    }
    .iframe-wrapper:hover .fullscreen-toggle {
      display: block;
    }
    #top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 9999;
    }
    #top-bar button {
      padding: 10px 15px;
      font-size: 14px;
      margin-right: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #editBtn { background: #ffc107; color: #000; }
    #menuBtn { background: #007bff; color: #fff; }
    #resetBtn { background: #dc3545; color: #fff; margin-top: 10px; width: 100%; }
    #crop-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.85);
      padding: 15px;
      border-radius: 8px;
      display: none;
      color: white;
      z-index: 9999;
    }
    #crop-controls label {
      display: block;
      margin-top: 10px;
    }
    #crop-controls input[type=range] {
      width: 200px;
    }
    #zoom-controls {
      margin-top: 10px;
    }
    #watermark {
      position: absolute;
      bottom: 5px;
      right: 10px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      z-index: 9999;
      font-family: monospace;
    }
  </style>
</head>
<body>
<div id="top-bar">
  <button id="editBtn">Modo Edição</button>
  <button id="menuBtn">Voltar ao Menu</button>
</div>
<div id="crop-controls">
  <label>Crop Top: <span id="topValue">0</span>px</label>
  <input type="range" id="cropTopSlider" min="0" max="200" value="0">
  <label>Crop Bottom: <span id="bottomValue">0</span>px</label>
  <input type="range" id="cropBottomSlider" min="0" max="200" value="0">
  <label id="zoom-controls">Zoom: <span id="zoomValue">1.15</span>x</label>
  <input type="range" id="zoomSlider" min="1" max="2" step="0.01" value="1.15">
  <button id="resetBtn">Resetar Crop</button>
</div>
<div id="watermark">made by Sergio Vieira - sergio.augusto@gpssa.com.br</div>
<div id="grid"></div>

<script>
  const { ipcRenderer } = require('electron');
  const fs = require('fs');
  const configPath = './config.json';
  const config = require(configPath);
  const grid = document.getElementById('grid');
  const cropTopSlider = document.getElementById('cropTopSlider');
  const cropBottomSlider = document.getElementById('cropBottomSlider');
  const topValue = document.getElementById('topValue');
  const bottomValue = document.getElementById('bottomValue');
  const zoomSlider = document.getElementById('zoomSlider');
  const zoomValue = document.getElementById('zoomValue');
  const resetBtn = document.getElementById('resetBtn');

  let cropTop = config.cropTop || 0;
  let cropBottom = config.cropBottom || 0;
  let zoom = config.zoom || 1.15;
  let fullscreenIndexes = config.fullscreenIndexes || [];
  const rows = config.rows;
  const cols = config.cols;
  let isEditMode = false;

  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

  function renderGrid(urls) {
    grid.innerHTML = '';
    urls.forEach((url, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'iframe-wrapper';
      wrapper.draggable = true;

      if (fullscreenIndexes.includes(index)) {
        wrapper.classList.add('fullscreen-cell');
      }

      wrapper.style.setProperty('--crop-top', `${cropTop}px`);

      const iframe = document.createElement('iframe');
      if (url) iframe.src = url;
      iframe.style.transform = `scale(${zoom})`;
      wrapper.appendChild(iframe);

      const cropBottomDiv = document.createElement('div');
      cropBottomDiv.className = 'crop-overlay crop-bottom';
      cropBottomDiv.style.height = `${cropBottom}px`;
      wrapper.appendChild(cropBottomDiv);

      const overlay = document.createElement('div');
      overlay.className = 'drag-overlay';
      overlay.style.display = isEditMode ? 'block' : 'none';
      wrapper.appendChild(overlay);

      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'fullscreen-toggle';
      toggleBtn.innerText = wrapper.classList.contains('fullscreen-cell') ? '⛶' : '🔍';
      toggleBtn.addEventListener('click', () => {
        wrapper.classList.toggle('fullscreen-cell');
        if (wrapper.classList.contains('fullscreen-cell')) {
          fullscreenIndexes.push(index);
          toggleBtn.innerText = '⛶';
        } else {
          fullscreenIndexes = fullscreenIndexes.filter(i => i !== index);
          toggleBtn.innerText = '🔍';
        }
        saveConfig();
      });
      wrapper.appendChild(toggleBtn);

      grid.appendChild(wrapper);
    });
  }

  function updateStyles() {
    document.querySelectorAll('.iframe-wrapper').forEach(wrapper => {
      const iframe = wrapper.querySelector('iframe');
      const bottomOverlay = wrapper.querySelector('.crop-bottom');
      if (iframe) iframe.style.transform = `scale(${zoom})`;
      if (bottomOverlay) bottomOverlay.style.height = `${cropBottom}px`;
      wrapper.style.setProperty('--crop-top', `${cropTop}px`);
    });
  }

  function saveConfig() {
    config.cropTop = cropTop;
    config.cropBottom = cropBottom;
    config.zoom = zoom;
    config.fullscreenIndexes = fullscreenIndexes;
    fs.writeFileSync(configPath, JSON.stringify(config, null, 2));
  }

  cropTopSlider.addEventListener('input', e => {
    cropTop = parseInt(e.target.value);
    topValue.textContent = cropTop;
    updateStyles();
    saveConfig();
  });

  cropBottomSlider.addEventListener('input', e => {
    cropBottom = parseInt(e.target.value);
    bottomValue.textContent = cropBottom;
    updateStyles();
    saveConfig();
  });

  zoomSlider.addEventListener('input', e => {
    zoom = parseFloat(e.target.value);
    zoomValue.textContent = zoom.toFixed(2);
    updateStyles();
    saveConfig();
  });

  resetBtn.addEventListener('click', () => {
    cropTop = 0;
    cropBottom = 0;
    zoom = 1.15;
    cropTopSlider.value = 0;
    cropBottomSlider.value = 0;
    zoomSlider.value = 1.15;
    topValue.textContent = '0';
    bottomValue.textContent = '0';
    zoomValue.textContent = '1.15';
    updateStyles();
    saveConfig();
  });

  document.getElementById('editBtn').addEventListener('click', () => {
    isEditMode = !isEditMode;
    document.getElementById('editBtn').textContent = isEditMode ? 'Sair do Modo Edição' : 'Modo Edição';
    document.querySelectorAll('.drag-overlay').forEach(overlay => {
      overlay.style.display = isEditMode ? 'block' : 'none';
    });
    document.getElementById('crop-controls').style.display = isEditMode ? 'block' : 'none';
  });

  document.getElementById('menuBtn').addEventListener('click', () => {
    ipcRenderer.send('open-setup');
  });

  cropTopSlider.value = cropTop;
  cropBottomSlider.value = cropBottom;
  zoomSlider.value = zoom;
  topValue.textContent = cropTop;
  bottomValue.textContent = cropBottom;
  zoomValue.textContent = zoom;

  renderGrid(config.urls);
</script>
</body>
</html>
